manager:
  # Manager 使用的模型名；必填；默认 gpt-5.2
  model: gpt-5.2
  # Manager 推理强度；可选值 minimal|low|medium|high|xhigh；默认 medium
  modelReasoningEffort: medium
  provider:
    # Manager 专用网关地址；可选；空字符串表示走自动发现（~/.codex/config.toml / OPENAI_BASE_URL）
    baseUrl: ""
    # Manager 专用 API Key；可选；敏感项；空字符串表示走环境与 codex 配置
    apiKey: ""
    # Manager 请求代理；可选；空字符串表示直连
    proxy: ""

worker:
  # Worker 使用的模型名；必填；默认 gpt-5.3-codex
  model: gpt-5.3-codex
  # Worker 推理强度；可选值 minimal|low|medium|high|xhigh；默认 high
  modelReasoningEffort: high
  # Worker 最大并发数；整数 >= 1；默认 3
  maxConcurrent: 3
  # Worker 单任务超时（毫秒）；整数 > 0；默认 600000（10 分钟）
  timeoutMs: 600000
  # Worker 请求代理；可选；空字符串表示直连
  proxy: ""

telegram:
  # 是否启用 Telegram 通道；默认 false
  enabled: false
  # Telegram Bot Token；当 enabled=true 时必填；敏感项
  botToken: ""
  # Telegram 默认目标 chat id；当 enabled=true 时必填
  chatId: ""
  # Telegram API 根地址；默认官方地址
  apiRoot: https://api.telegram.org
  # Telegram 代理地址；可选；留空表示直连
  proxy: ""
