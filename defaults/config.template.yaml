manager:
  provider:
    model: gpt-5.2-high
    modelReasoningEffort: high
    # Optional manager-only provider overrides.
    # If omitted, manager keeps provider auto-discovery behavior.
    # baseUrl: ${BASE_URL}
    # apiKey: ${API_KEY}
  maxCorrectionRounds: 3
  promptSections:
    actionFeedbackMaxBytes: 8192
    batchResultsMaxBytes: 20480
    compressedContextMaxBytes: 12288
    environmentMaxBytes: 4096
    fileLookupMaxBytes: 20480
    focusContextsMaxBytes: 20480
    focusListMaxBytes: 8192
    historyLookupMaxBytes: 20480
    inputsMaxBytes: 8192
    memoryMaxBytes: 8192
    plansMaxBytes: 16384
    recentHistoryMaxBytes: 8192
    tasksMaxBytes: 24576
  taskCreate:
    debounceMs: 4000
  idleTrigger:
    delayMs: 900000
  taskWindow:
    maxCount: 20
    minCount: 5
  planWindow:
    maxCount: 20
    minCount: 5
worker:
  maxConcurrent: 3
  retry:
    maxAttempts: 1
    backoffMs: 5000
  timeoutMs: 600000
  model: gpt-5.3-codex-high
  modelReasoningEffort: high
qq:
  enabled: false
  appId: ''
  appSecret: ''
  apiBase: https://api.sgroup.qq.com
  callbackPath: /api/qq/events
  verifySign: true
  clockSkewMs: 300000
