<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mimikit</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="components-core.css" />
    <link rel="stylesheet" href="components-choice.css" />
    <link rel="stylesheet" href="components-messages-bubble.css" />
    <link rel="stylesheet" href="components-messages-quote.css" />
    <link rel="stylesheet" href="components-messages-meta.css" />
    <link rel="stylesheet" href="components-messages-composer-quote.css" />
    <link rel="stylesheet" href="components-messages-quote-button.css" />
    <link rel="stylesheet" href="components-messages-loading.css" />
    <link rel="stylesheet" href="components-markdown.css" />
    <link rel="stylesheet" href="components-dialogs-restart.css" />
    <link rel="stylesheet" href="components-dialogs-panels-shared.css" />
    <link rel="stylesheet" href="components-dialogs-tasks-panel.css" />
    <link rel="stylesheet" href="components-dialogs-plans-focuses.css" />
    <link rel="stylesheet" href="components-responsive.css" />
  </head>
  <body>
    <main data-app>
      <header class="app-header">
        <div class="app-controls" role="group" aria-label="Top controls">
          <div class="status-group" aria-label="Status">
            <p class="status-item">
              <span class="status-dot" data-status-dot></span>
              <span class="status-text" data-status-text aria-live="polite"
                >CONNECTING</span
              >
            </p>
          </div>
          <div class="app-actions" role="toolbar" aria-label="Controls">
            <button
              class="btn btn--sm focuses-open"
              data-focuses-open
              type="button"
              title="Focus"
              aria-label="Focus"
              aria-haspopup="dialog"
              aria-controls="focuses-dialog"
              aria-expanded="false"
            >
              <span class="focuses-label">Focus</span>
            </button>
            <button
              class="btn btn--sm plans-open"
              data-plans-open
              type="button"
              title="Plans"
              aria-label="Plans"
              aria-haspopup="dialog"
              aria-controls="plans-dialog"
              aria-expanded="false"
            >
              <span class="plans-label">Plans</span>
            </button>
            <button
              class="btn btn--sm tasks-open"
              data-tasks-open
              type="button"
              title="Tasks"
              aria-label="Tasks"
              aria-haspopup="dialog"
              aria-controls="tasks-dialog"
              aria-expanded="false"
            >
              <span class="tasks-label">Tasks</span>
              <span class="tasks-worker-dots" data-worker-dots aria-hidden="true"></span>
            </button>
            <div class="tools-menu-wrap">
              <button
                class="btn btn--sm tools-toggle"
                data-tools-toggle
                type="button"
                title="Tools"
                aria-label="Tools"
                aria-haspopup="menu"
                aria-controls="tools-menu"
                aria-expanded="false"
              >
                Tools
              </button>
              <div class="tools-menu" data-tools-menu id="tools-menu" role="menu" hidden>
                <button
                  class="tools-menu-item"
                  data-tools-restart
                  type="button"
                  role="menuitem"
                  title="Restart"
                  aria-label="Restart"
                >
                  Restart
                </button>
                <button
                  class="tools-menu-item tools-menu-item--danger"
                  data-tools-reset
                  type="button"
                  role="menuitem"
                  title="Reset"
                  aria-label="Reset"
                >
                  Reset
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <section class="messages-section" aria-label="Chat">
        <h2 class="visually-hidden">Chat</h2>
        <ul
          class="messages scrollable"
          data-messages
          role="log"
          aria-live="polite"
          aria-relevant="additions text"
          aria-atomic="false"
        ></ul>
        <button
          class="btn btn--icon btn--icon-lg scroll-bottom"
          data-scroll-bottom
          type="button"
          title="Scroll down"
          aria-label="Scroll down"
          aria-hidden="true"
          inert
          tabindex="-1"
        >
          &#x2193;
        </button>
      </section>

      <section
        class="choice-panel"
        data-choice-panel
        aria-live="polite"
        aria-label="Pending question"
        hidden
      >
        <p class="choice-question" data-choice-question></p>
        <div class="choice-options" role="tablist" data-choice-options></div>
        <p class="choice-meta" data-choice-meta></p>
      </section>

      <section class="composer" aria-label="Input">
        <form data-form>
          <div class="quote-preview" data-quote-preview hidden>
            <span class="quote-label" data-quote-label>Quote</span>
            <span class="quote-text" data-quote-text></span>
            <button
              class="btn btn--icon btn--icon-muted quote-clear"
              type="button"
              data-quote-clear
              title="Clear"
              aria-label="Clear"
            >
              &times;
            </button>
          </div>
          <label class="visually-hidden" for="message-input">Message</label>
          <textarea
            id="message-input"
            data-input
            placeholder="Message..."
            rows="1"
          ></textarea>
          <button class="btn btn--md btn--primary" type="submit" data-send>
            Send
          </button>
        </form>
      </section>

      <dialog
        class="plans-dialog"
        data-plans-dialog
        id="plans-dialog"
        aria-labelledby="plans-title"
      >
        <section class="plans-panel">
          <header class="plans-header">
            <h2 class="plans-title" id="plans-title">Plans</h2>
            <div class="plans-actions" role="group" aria-label="Plans">
              <button
                class="btn btn--icon btn--icon-muted plans-close"
                data-plans-close
                type="button"
                title="Close"
                aria-label="Close"
              >
                &#x2715;
              </button>
            </div>
          </header>
          <ul class="plans-list scrollable" data-plans-list></ul>
        </section>
      </dialog>

      <dialog
        class="tasks-dialog"
        data-tasks-dialog
        id="tasks-dialog"
        aria-labelledby="tasks-title"
      >
        <section class="tasks-panel">
          <header class="tasks-header">
            <h2 class="tasks-title" id="tasks-title">Tasks</h2>
            <div class="tasks-actions" role="group" aria-label="Tasks">
              <button
                class="btn btn--icon btn--icon-muted tasks-close"
                data-tasks-close
                type="button"
                title="Close"
                aria-label="Close"
              >
                &#x2715;
              </button>
            </div>
          </header>
          <ul class="tasks-list scrollable" data-tasks-list></ul>
        </section>
      </dialog>

      <dialog
        class="focuses-dialog"
        data-focuses-dialog
        id="focuses-dialog"
        aria-labelledby="focuses-title"
      >
        <section class="focuses-panel">
          <header class="focuses-header">
            <h2 class="focuses-title" id="focuses-title">Focus</h2>
            <div class="focuses-actions" role="group" aria-label="Focus">
              <button
                class="btn btn--icon btn--icon-muted focuses-close"
                data-focuses-close
                type="button"
                title="Close"
                aria-label="Close"
              >
                &#x2715;
              </button>
            </div>
          </header>
          <ul class="focuses-list scrollable" data-focuses-list></ul>
        </section>
      </dialog>

      <dialog
        class="restart-dialog"
        data-restart-dialog
        id="restart-dialog"
        aria-labelledby="restart-title"
        aria-describedby="restart-description"
      >
        <section class="restart-panel">
          <header class="restart-header">
            <h2 class="restart-title" id="restart-title">Restart?</h2>
          </header>
          <p class="restart-description" id="restart-description">
            Restart keeps state. Reset clears .mimikit first.
          </p>
          <div class="restart-actions" role="group" aria-label="Restart">
            <button
              class="btn btn--md btn--dialog btn--danger restart-dialog-btn-danger"
              data-restart-reset
              type="button"
            >
              Reset
            </button>
            <button class="btn btn--md btn--dialog" data-restart-cancel type="button">
              Cancel
            </button>
            <button
              class="btn btn--md btn--dialog btn--primary"
              data-restart-confirm
              type="button"
            >
              Restart
            </button>
          </div>
        </section>
      </dialog>

      <dialog
        class="message-delete-dialog"
        data-message-delete-dialog
        id="message-delete-dialog"
        aria-labelledby="message-delete-title"
        aria-describedby="message-delete-description"
      >
        <section class="message-delete-panel">
          <header class="message-delete-header">
            <h2 class="message-delete-title" id="message-delete-title">
              Delete Message?
            </h2>
          </header>
          <p class="message-delete-description" id="message-delete-description">
            This will replace the original content with a system message.
          </p>
          <div class="message-delete-actions" role="group" aria-label="Delete message">
            <button
              class="btn btn--md btn--dialog"
              data-message-delete-cancel
              type="button"
            >
              Cancel
            </button>
            <button
              class="btn btn--md btn--dialog btn--danger"
              data-message-delete-confirm
              type="button"
            >
              Delete
            </button>
          </div>
        </section>
      </dialog>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
